plugins {
    id 'com.android.application'
}

// Número de versión automático: cada compilación en GitHub sube 1
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.samuel.misgastos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.samuel.misgastos'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    // Firma fija: permite instalar cada APK nuevo encima del anterior sin perder datos.
    // No cambies ni borres misgastos.keystore.
    signingConfigs {
        fija {
            storeFile file('misgastos.keystore')
            storePassword 'misgastos2026'
            keyAlias 'misgastos'
            keyPassword 'misgastos2026'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fija
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
